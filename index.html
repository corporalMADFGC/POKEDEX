<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medallero Pokédex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{font-family:Inter,system-ui,sans-serif}.fl,#ln,#ln option{font-family:"Noto Color Emoji",Inter,system-ui,sans-serif}.card{transition:transform .2s}.card:hover{transform:translateY(-4px)}</style>
</head><body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
<div id="shell">

<div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
<div class="flex items-center gap-3"><div class="bg-red-600 text-white p-2.5 rounded-2xl text-xl">🏅</div>
<div><h1 class="text-xl font-extrabold tracking-wider uppercase">Medallero Pokédex</h1><p class="text-xs text-slate-500 dark:text-slate-400" data-i="sub"></p></div></div>
<select id="lang" onchange="setLang(this.value)" class="bg-slate-100 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl px-3 py-1.5 text-sm">
<option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select>
</div></header>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
<div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
<div><select id="gf" onchange="gf=this.value;draw()" class="w-full bg-gray-500 hover:bg-gray-600 dark:bg-gray-600 dark:hover:bg-gray-500 text-white font-extrabold text-lg rounded-2xl py-3 px-4 shadow-sm transition cursor-pointer text-center [text-align-last:center] [&amp;&gt;option]:text-slate-900 [&amp;&gt;option]:bg-white"></select></div>
<div class="flex gap-3"><button id="tabpl" onclick="togTab('pl')"></button><button id="tabco" onclick="togTab('co')"></button></div>
<div id="secpl" class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div id="ranking" class="h-full"></div><div id="dexrank" class="h-full"></div></div>
<div id="secco" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-4"><div id="countries" class="h-full"></div><div id="dexcountry" class="h-full"></div></div>
<button id="btnpk" onclick="togSec('pk')" class="w-full flex items-center justify-center gap-3 bg-red-600 hover:bg-red-700 text-white font-extrabold text-lg rounded-2xl py-3 shadow-sm transition"></button>
<div id="pksec" class="hidden space-y-3"><div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700"><input id="q" oninput="onSearch(this.value)" data-ph="search" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-sm"></div>
<div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto pr-1 pt-1"></div>
<div id="gridmore"></div></div>
<button id="btncal" onclick="togSec('cal')" class="w-full flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-lg rounded-2xl py-3 shadow-sm transition"></button>
<div id="calsec" class="hidden"></div>
<div id="admin"></div>
</main>
<div id="modal" class="fixed inset-0 z-50 hidden bg-black/60 items-center justify-center p-4" onclick="if(event.target===this)closeM()">

const wp=cdexSel&&got[cdexSel]?`<div class="rounded-xl border border-slate-200 dark:border-slate-600 p-3"><div class="flex items-center gap-2 mb-2">${byId[cdexSel].img?`<img src="${esc(byId[cdexSel].img)}" alt="" class="w-10 h-10 object-contain">`:""}<button onclick="openM(${cdexSel})" class="font-bold hover:underline">#${String(cdexSel).padStart(3,"0")} ${esc(byId[cdexSel].name)}</button></div><ul class="space-y-1 text-sm">${got[cdexSel].w.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(x=>`<li class="flex flex-wrap items-center gap-x-2">🥇 <span>${crownh(x.player)}${plb(x.player)}</span><span class="inline-flex items-center gap-1 text-xs font-semibold ${GT[x.game]||""}"><span class="w-2.5 h-2.5 rounded-full ${GC[x.game]||"bg-slate-400"}"></span>${esc(x.game)}</span><span class="text-xs text-slate-500 dark:text-slate-400">${x.torneo?esc(x.torneo)+" · ":""}${fdx(x.date)}</span></li>`).join("")}</ul></div>`:"";
mbox.innerHTML=`<div class="flex items-center gap-4"><div class="fl text-5xl">${flag(c)}</div><div class="flex-1 min-w-0"><h2 class="text-2xl font-extrabold break-words">${esc(cname(c))}</h2><p class="text-sm text-slate-500 dark:text-slate-400">📖 ${nGot}/151${gs()}</p></div><button onclick="closeM()" class="self-start px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700">✕</button></div>${wp}<div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2">${cells}</div>`;
showM()}
function openDex(n){const got={},byId={};
items.forEach(p=>{byId[p.id]=p;cs(p).forEach(c=>{if(c.player!==n||c.medal!=="gold")return;const g=got[p.id]=got[p.id]||{d:""};if(c.date&&(!g.d||c.date<g.d))g.d=c.date})});
sel=null;selP=null;selC=null;selMed=null;dexOpenFor=null;selDex=n;selCD=null;
const fdx=d=>d?new Date(d+"T00:00:00").toLocaleDateString(lang,{day:"numeric",month:"short",year:"numeric"}):"—",nGot=Object.keys(got).length;let cells="";
for(let id=1;id<=151;id++){const p=byId[id],g=got[id],gray=g?"":' style="filter:grayscale(1)"';
const tz=p&&p.img?`<img src="${esc(p.img)}" alt=""${gray} class="w-14 h-14 object-contain ${g?"":"opacity-40"}">`
:(p?`<span class="fl w-14 h-14 rounded-full flex items-center justify-center text-3xl ${g?"bg-white ring-2 ring-slate-300":"bg-slate-300 dark:bg-slate-600 opacity-50"}">${(TY[p.type]||TY.Normal)[0]}</span>`
:`<span class="w-14 h-14 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-400 dark:text-slate-500 text-xs font-bold flex items-center justify-center">${String(id).padStart(3,"0")}</span>`);
cells+=`<div class="flex flex-col items-center gap-0.5">${tz}<span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 h-3 leading-3">${g?fdx(g.d):""}</span></div>`}
mbox.innerHTML=`<div class="flex items-center gap-4"><div class="flex-1 min-w-0"><h2 class="text-2xl font-extrabold break-words"><span class="fl">${pflag(n)}</span> ${esc(n)}</h2><p class="text-sm text-slate-500 dark:text-slate-400">📖 ${nGot}/151${gs()}</p></div><button onclick="closeM()" class="self-start px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700">✕</button></div><div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2">${cells}</div>`;
showM()}
function togDex(n){dexOpenFor=dexOpenFor===n?null:n;openPl(n)}
function togPl(k){plSec=plSec===k?null:k;openPl(selP)}
function openPl(n){if(selP!==n)plSec=null;const rows=[];items.forEach(p=>p.catches.forEach((c,i)=>{if(c.player===n)rows.push({p,c,i})}));
if(!rows.length){closeM();return}sel=null;selP=n;selC=null;selMed=null;selDex=null;selCD=null;
const nt=natOf(n),tn=[...new Set(rows.map(r=>r.c.torneo).filter(Boolean))],mc=m=>rows.filter(r=>r.c.medal===m).length,pts=rows.reduce((a,r)=>a+MED[r.c.medal][1]*(r.c.mult||1),0);
rows.sort((a,b)=>(b.c.date||"").localeCompare(a.c.date||""));
const fd=d=>d?new Date(d+"T00:00:00").toLocaleDateString(lang,{day:"numeric",month:"short",year:"numeric"}):"—",box=(l,v)=>`<div class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-2"><p class="text-[11px] text-slate-500 dark:text-slate-400">${l}</p><p class="text-base font-black whitespace-nowrap">${v}</p></div>`;
const gold={};rows.forEach(r=>{if(r.c.medal==="gold")(gold[r.p.id]=gold[r.p.id]||{p:r.p,n:0}).n++});
const dl=Object.values(gold).sort((a,b)=>a.p.id-b.p.id),dopen=dexOpenFor===n;
const dexBlock=`<div><button data-n="${esc(n)}" onclick="togDex(this.dataset.n)" class="flex items-center gap-2 font-bold hover:underline"><span>📖 POKEDEX</span><span class="text-red-600 dark:text-red-400">${dl.length}/151</span><span class="text-xs">${dopen?"▲":"▼"}</span></button>${dopen?(dl.length?`<ul class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2">${dl.map(x=>{const ty=TY[x.p.type]||TY.Normal;return `<li class="flex items-center gap-2 bg-slate-50 dark:bg-slate-700/50 rounded-xl p-2"><span class="w-10 h-10 flex items-center justify-center shrink-0">${x.p.img?`<img src="${esc(x.p.img)}" alt="" class="w-10 h-10 object-contain">`:`<span class="fl text-2xl">${ty[0]}</span>`}</span><span class="text-xs font-bold text-slate-400">#${String(x.p.id).padStart(3,"0")}</span><button onclick="openM(${x.p.id})" class="flex-1 text-left text-sm font-semibold hover:underline">${esc(x.p.name)}</button><span class="text-xs font-extrabold px-2 py-0.5 rounded-full bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400">×${x.n}</span></li>`}).join("")}</ul>`:`<p class="text-xs text-slate-400 mt-2">—</p>`):""}</div>`;
const thumb=r=>{const ty=TY[r.p.type]||TY.Normal;return `<button onclick="openM(${r.p.id})" class="flex items-center gap-2 font-semibold hover:underline">${r.p.img?`<img src="${esc(r.p.img)}" class="w-8 h-8 object-contain">`:`<span class="fl text-xl">${ty[0]}</span>`}${esc(r.p.name)}</button>`};
const regHtml=`<div><h4 class="font-bold mb-2">${t("pregistry")}</h4><div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead><tr class="text-slate-400 border-b border-slate-200 dark:border-slate-600"><th class="py-1 px-2">Pokémon</th><th class="px-2">${t("game")}</th><th class="px-2">${t("medal")}</th><th class="px-2">${t("torneo")}</th><th class="px-2">${t("date")}</th>${can?"<th></th>":""}</tr></thead><tbody>`+rows.map(r=>`<tr class="border-b border-slate-100 dark:border-slate-700"><td class="py-1.5 px-2">${thumb(r)}</td><td class="px-2">${esc(r.c.game)}</td><td class="px-2">${MED[r.c.medal][0]}${r.c.mult>1?" ×"+r.c.mult:""}</td><td class="px-2">${r.c.torneo?esc(r.c.torneo):"—"}</td><td class="px-2 whitespace-nowrap">${fd(r.c.date)}</td>${can?`<td class="px-2"><button onclick="delC(${r.p.id},${r.i})" class="text-red-600 hover:underline">${armed==="c"+r.p.id+"_"+r.i?t("conf"):t("del")}</button></td>`:""}</tr>`).join("")+`</tbody></table></div></div>`;
const lab=l=>`<p class="text-[11px] text-slate-500 dark:text-slate-400">${l}</p>`,cbx="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-2",
bbox=(l,v,k)=>`<button onclick="togPl('${k}')" class="${cbx} hover:ring-2 hover:ring-red-400 transition ${plSec===k?"ring-2 ring-red-500":""}">${lab(l+" "+(plSec===k?"▲":"▼"))}<p class="text-base font-black whitespace-nowrap">${v}</p></button>`,
sbox=`<div class="${cbx}">${lab(t("summary"))}<p class="text-base font-black whitespace-nowrap flex justify-center gap-1">${["gold","silver","bronze"].map(m=>`<button onclick="togPl('${m}')" class="rounded-lg px-1.5 hover:bg-slate-200 dark:hover:bg-slate-600 transition ${plSec===m?"ring-2 ring-red-500":""}">${MED[m][0]}${mc(m)}</button>`).join("")}</p></div>`;
const drow=(r,pt)=>{const b=MED[r.c.medal][1],mx=r.c.mult||1;return `<tr class="border-b border-slate-100 dark:border-slate-700"><td class="py-1.5 px-2 whitespace-nowrap">${fd(r.c.date)}</td><td class="px-2"><div class="flex items-center gap-1.5">${thumb(r)}${mx>1?`<b class="text-red-600 dark:text-red-400">x${mx}</b>`:""}</div></td><td class="px-2"><span class="inline-flex items-center gap-1 font-semibold ${GT[r.c.game]||""}"><span class="w-2.5 h-2.5 rounded-full ${GC[r.c.game]||"bg-slate-400"}"></span>${esc(r.c.game)}</span></td><td class="px-2">${r.c.torneo?esc(r.c.torneo):"—"}</td>${pt?`<td class="px-2">${MED[r.c.medal][0]}</td>`:""}<td class="px-2 whitespace-nowrap font-extrabold text-red-600 dark:text-red-400">${b*mx}</td></tr>`};
const dh=(pt)=>`<thead><tr class="text-slate-400 border-b border-slate-200 dark:border-slate-600"><th class="py-1 px-2">${t("date")}</th><th class="px-2">Pokémon</th><th class="px-2">${t("game")}</th><th class="px-2">${t("torneo")}</th>${pt?`<th class="px-2">${t("medal")}</th>`:""}<th class="px-2">${t("pts")}</th></tr></thead>`;
const det=plSec==="pts"?`<div class="rounded-xl border border-slate-200 dark:border-slate-600 p-3"><h4 class="font-bold text-sm mb-2">${t("ptsfrom")}</h4><div class="overflow-x-auto"><table class="w-full text-xs text-left">${dh(1)}<tbody>${rows.map(r=>drow(r,1)).join("")}</tbody></table></div></div>`
:plSec?`<div class="rounded-xl border border-slate-200 dark:border-slate-600 p-3"><h4 class="font-bold text-sm mb-2">${MED[plSec][0]} ${t(plSec)} (${mc(plSec)})</h4><div class="overflow-x-auto"><table class="w-full text-xs text-left">${dh(0)}<tbody>${rows.filter(r=>r.c.medal===plSec).map(r=>drow(r,0)).join("")}</tbody></table></div></div>`:"";
mbox.innerHTML=`<div class="flex items-center gap-4"><div class="fl text-5xl">${crown(n)}${flag(nt)||"👤"}</div><div class="flex-1">${renaming===n?`<form onsubmit="saveName(event,this.dataset.n)" data-n="${esc(n)}" class="flex items-center gap-2"><input id="rn" value="${esc(n)}" required class="flex-1 min-w-0 px-2 py-1 text-lg font-bold bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg"><button class="px-2 py-1 rounded-lg bg-red-600 text-white text-sm font-semibold">${t("save")}</button><button type="button" onclick="renaming=null;openPl(selP)" class="text-sm text-slate-500 hover:underline">${t("cancel")}</button></form>`:`<h2 class="text-2xl font-extrabold">${esc(n)}${can?` <button data-n="${esc(n)}" onclick="renaming=this.dataset.n;openPl(renaming);focusRn()" class="text-sm align-middle hover:opacity-70" title="${t("editname")}">✏️</button>`:""}</h2>`}<p class="text-sm text-slate-500 dark:text-slate-400">${nt?esc(cname(nt)):t("nonat2")}</p></div><button onclick="closeM()" class="self-start px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700">✕</button></div>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">${box(t("ncatch"),rows.length)}${box(t("pokes"),new Set(rows.filter(r=>r.c.medal==="gold").map(r=>r.p.id)).size+"/151")}${bbox(t("pts"),pts,"pts")}${sbox}</div>
${det}
${tn.length?`<p class="text-xs text-slate-500 dark:text-slate-400">🏟️ ${tn.map(esc).join(" · ")}</p>`:""}
${dexBlock}
${regHtml}`;
showM()}
function openM(id,keep){const p=items.find(x=>x.id===id);if(!p){closeM();return}sel=id;selP=null;selC=null;selMed=null;selDex=null;selCD=null;const ty=TY[p.type]||TY.Normal;
const tables=GAMES.map(g=>{const s={};p.catches.filter(c=>c.game===g).forEach(c=>{s[c.player]=s[c.player]||{n:c.player,gold:0,silver:0,bronze:0,pts:0};s[c.player][c.medal]++;s[c.player].pts+=MED[c.medal][1]*(c.mult||1)});
const r=Object.values(s).sort((a,b)=>b.pts-a.pts||b.gold-a.gold||b.silver-a.silver);
return `<div class="bg-slate-50 dark:bg-slate-700/40 rounded-2xl p-4"><h5 class="font-bold text-sm mb-2">🎲 ${g}</h5>`+(r.length?`<div class="sc overflow-auto"><table class="w-full text-xs text-left"><thead><tr class="text-slate-400 border-b border-slate-200 dark:border-slate-600"><th class="py-1 px-2">${t("pos")}</th><th class="px-2">${t("player")}</th><th class="px-2 text-center">${t("nat")}</th><th class="px-2 text-center">🥇</th><th class="px-2 text-center">🥈</th><th class="px-2 text-center">🥉</th><th class="px-2 text-right">${t("pts")}</th></tr></thead><tbody>`+xrows("m"+p.id+"|"+g,r).map((x,i)=>`<tr class="border-b border-slate-100 dark:border-slate-700"><td class="py-1.5 px-2 font-extrabold ${rk(i)}">${i+1}</td><td class="px-2 font-semibold">${plb(x.n)}</td><td class="px-2 text-center text-base fl" title="${esc(cname(natOf(x.n)))}">${pflag(x.n)}</td><td class="px-2 text-center">${x.gold}</td><td class="px-2 text-center">${x.silver}</td><td class="px-2 text-center">${x.bronze}</td><td class="px-2 text-right font-extrabold text-red-600 dark:text-red-400">${x.pts}</td></tr>`).join("")+`</tbody></table></div>`+xbtn("m"+p.id+"|"+g,r.length):`<p class="text-xs text-slate-400 italic">${t("nomatch")} ${g}.</p>`)+`</div>`}).join("");
const ap=[],seen=new Set();cs(p).forEach(c=>{if(!c.torneo&&!c.date)return;const k=(c.torneo||"")+"|"+(c.date||"")+"|"+c.game;if(!seen.has(k)){seen.add(k);ap.push({n:c.torneo||"—",d:c.date||"",g:c.game})}});ap.sort((a,b)=>a.d.localeCompare(b.d));
const fdt=d=>d?new Date(d+"T00:00:00").toLocaleDateString(lang,{day:"numeric",month:"short",year:"numeric"}):"—";
const hist=ap.map((a,i)=>`<li class="flex items-center gap-3 py-1.5 text-sm border-b border-slate-100 dark:border-slate-700"><span class="w-7 h-7 rounded-full ${GC[a.g]||"bg-slate-500"} text-white text-xs font-bold flex items-center justify-center shrink-0">${i+1}</span><span class="flex-1 font-semibold">${esc(a.n)}</span><span class="text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${fdt(a.d)}</span></li>`).join("");
mbox.innerHTML=`<div class="flex items-center gap-4">${pic(p,"w-24 h-24 shrink-0")}
<div class="flex-1"><span class="text-xs font-bold text-red-600">#${String(p.id).padStart(3,"0")} · ${esc(p.type)}</span><h2 class="text-2xl font-extrabold">${esc(p.name)}</h2>${can?`<label class="text-xs text-red-600 hover:underline cursor-pointer">📷 ${t("img")}<input type="file" accept="image/*" class="hidden" onchange="upImg(${p.id},this.files[0])"></label><label class="block text-xs text-slate-500 dark:text-slate-400 mt-1">${t("tot")}: <input type="number" min="1" value="${p.tot||""}" onchange="setTot(${p.id},this.value)" class="w-16 px-1 py-0.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded text-xs"></label>`:""}</div>
<button onclick="closeM()" class="self-start px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700">✕</button></div>
<div><h4 class="font-bold mb-2">${t("summary")}</h4><div class="grid grid-cols-3 gap-3 text-center">${Object.keys(MED).map(m=>`<div class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-3"><p class="text-xs">${MED[m][0]} ${t(m)}</p><p class="text-2xl font-black">${cnt(p,m)}</p></div>`).join("")}</div></div>
<div class="space-y-3"><h4 class="font-bold">${t("leagues")}</h4>${tables}</div>
${hist?`<div><h4 class="font-bold mb-1">${t("apar")}${gs()}</h4>${gf==="all"?`<p class="flex flex-wrap gap-3 text-xs text-slate-500 dark:text-slate-400 mb-1">${GAMES.map(g=>`<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full ${GC[g]}"></span>${g}</span>`).join("")}</p>`:""}<ul>${hist}</ul></div>`:""}
${can?`<button onclick="delP(${p.id})" class="text-sm text-red-600 hover:underline">${armed==="p"+p.id?t("conf"):t("delp")}</button>`:""}`;
showM()}
function closeM(){sel=null;selP=null;selC=null;selMed=null;selDex=null;selCD=null;cdexSel=null;plSec=null;dexOpenFor=null;renaming=null;modal.classList.add("hidden");modal.classList.remove("flex")}
i18n();draw();if(ADMIN)loadVisits();

</script>
</body></html>

<h3 class="text-center font-bold mt-3 mb-2">${esc(p.name)}</h3>
<div class="border-t border-slate-100 dark:border-slate-700 pt-2 flex justify-around text-xs font-semibold"><span>🥇 ${cnt(p,"gold")}</span><span>🥈 ${cnt(p,"silver")}</span><span>🥉 ${cnt(p,"bronze")}</span></div></div>`}).join(""):`<p class="col-span-full text-center py-10 text-slate-400">${items.length?t("none"):t("loading")}</p>`}
function adminPanel(){const a=document.getElementById("admin"),keep=["lp","lg","lpl","ln","lm","lx","lt","ld"].map(i=>{const x=document.getElementById(i);return x?x.value:null});
if(!can){a.innerHTML="";return}
a.innerHTML=`<div class="bg-white dark:bg-slate-800 border-2 border-dashed border-red-500 rounded-2xl p-5 space-y-4"><div class="flex flex-wrap items-center justify-between gap-2"><h3 class="font-bold">🛡️ ${t("admin")}</h3><div class="flex gap-2"><button onclick="dl()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-3 py-1.5 rounded-lg">⬇ ${t("dl")}</button><button onclick="resetDraft()" class="text-sm text-red-600 hover:underline">${armed==="reset"?t("conf"):t("rst")}</button></div></div><p class="text-xs text-slate-500 dark:text-slate-400">${t("hint")}</p>
<div class="grid md:grid-cols-2 gap-4">
<form onsubmit="addP(event)" class="space-y-2 bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl"><h4 class="font-semibold text-sm">${t("addp")}</h4>
<input id="np" required placeholder="${t("name")}" class="${I}"><div class="grid grid-cols-2 gap-2"><input id="ni" type="number" min="1" required placeholder="${t("num")}" class="${I}">
<select id="nt" class="${I}">${Object.keys(TY).map(k=>opt(k,k)).join("")}</select></div>
<input id="nf" type="file" accept="image/*" class="${I}"><button class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg text-sm">${t("addp")}</button></form>
<form onsubmit="logC(event)" class="space-y-2 bg-slate-50 dark:bg-slate-700/50 p-4 rounded-xl"><h4 class="font-semibold text-sm">${t("log")}</h4>
<select id="lp" class="${I}">${items.map(p=>opt(p.id,`#${p.id} ${p.name}`)).join("")}</select>
<div class="grid grid-cols-2 gap-2"><select id="lg" class="${I}">${GAMES.map(g=>opt(g,g)).join("")}</select>
<input id="lpl" list="players" required placeholder="${t("player")}" class="${I}"></div>
<select id="ln" class="${I}">${opt("",t("nat"))+countries().map(c=>opt(c[0],flag(c[0])+" "+c[1])).join("")}</select>
<div class="grid grid-cols-2 gap-2"><select id="lm" class="${I}">${Object.keys(MED).map(m=>opt(m,MED[m][0]+" "+t(m))).join("")}</select>
<select id="lx" class="${I}">${[1,2,3,4,5].map(v=>opt(v,t("mult")+" ×"+v)).join("")}</select></div>
<div class="grid grid-cols-2 gap-2"><input id="lt" list="torneos" placeholder="${t("torneo")}" class="${I}"><input id="ld" type="date" value="${today()}" class="${I}"></div>
<datalist id="torneos">${[...new Set(items.flatMap(p=>p.catches.map(c=>c.torneo)).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
<button class="w-full bg-slate-800 hover:bg-slate-900 dark:bg-slate-600 text-white font-semibold py-2 rounded-lg text-sm">${t("logb")}</button></form></div></div>`;
["lp","lg","lpl","ln","lm","lx","lt","ld"].forEach((i,k)=>{const x=document.getElementById(i);if(x&&keep[k]!==null)x.value=keep[k]})}
function save(p){const i=items.findIndex(x=>x.id===p.id);if(i<0)items.push(p);else items[i]=p;items.sort((a,b)=>a.id-b.id);persist()}
async function upImg(id,f){if(!f)return;try{const p=items.find(x=>x.id===id);save({...p,img:await shrink(f)})}catch(e){toast(t("err")+e.message)}}
async function addP(e){e.preventDefault();const id=parseInt(ni.value);if(items.some(p=>p.id===id))return toast(t("dup"));const p={id,name:np.value.trim(),type:nt.value,catches:[]},f=nf.files[0];e.target.reset();try{if(f)p.img=await shrink(f)}catch(x){toast(t("err")+x.message)}save(p)}
function logC(e){e.preventDefault();try{const p=items.find(x=>x.id==lp.value);if(!p)return toast(t("err")+"Pokémon");
const player=lpl.value.trim().replace(/\s+/g," "),ex=items.flatMap(x=>x.catches).find(c=>c.player.toLowerCase()===player.toLowerCase());
const mx=parseInt(lx.value)||1,nn=ln.value||natOf(ex?ex.player:player),c={game:lg.value,player:ex?ex.player:player,medal:lm.value};if(nn)c.nat=nn;if(mx>1)c.mult=mx;if(ld.value)c.date=ld.value;if(lt.value.trim())c.torneo=lt.value.trim();
save({...p,catches:[...p.catches,c]});lpl.value=""}catch(x){toast(t("err")+(x.message||x))}}
let armed=null;function arm(k){if(armed===k){armed=null;return true}armed=k;rerender();adminPanel();setTimeout(()=>{if(armed===k){armed=null;rerender();adminPanel()}},3500);return false}
function toast(m){const d=document.createElement("div");d.className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm px-4 py-2 rounded-xl shadow-lg";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
function delC(id,i){if(!arm("c"+id+"_"+i))return;const p=items.find(x=>x.id===id);if(!p)return;save({...p,catches:p.catches.filter((_,j)=>j!==i)})}
function delP(id){if(!arm("p"+id))return;closeM();items=items.filter(x=>x.id!==id);persist()}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const plb=n=>`<button data-n="${esc(n)}" onclick="openPl(this.dataset.n)" class="hover:underline text-left">${esc(n)}</button>`;
function rerender(){if(sel!==null)openM(sel,true);else if(selP!==null)openPl(selP)}
function openPl(n){const rows=[];items.forEach(p=>p.catches.forEach((c,i)=>{if(c.player===n)rows.push({p,c,i})}));
if(!rows.length){closeM();return}sel=null;selP=n;
const nt=natOf(n),tn=[...new Set(rows.map(r=>r.c.torneo).filter(Boolean))],mc=m=>rows.filter(r=>r.c.medal===m).length,pts=rows.reduce((a,r)=>a+MED[r.c.medal][1]*(r.c.mult||1),0);
rows.sort((a,b)=>(b.c.date||"").localeCompare(a.c.date||""));
const fd=d=>d?new Date(d+"T00:00:00").toLocaleDateString(lang):"—",box=(l,v)=>`<div class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-3"><p class="text-xs text-slate-500 dark:text-slate-400">${l}</p><p class="text-xl font-black">${v}</p></div>`;
mbox.innerHTML=`<div class="flex items-center gap-4"><div class="fl text-5xl">${flag(nt)||"👤"}</div><div class="flex-1"><h2 class="text-2xl font-extrabold">${esc(n)}</h2><p class="text-sm text-slate-500 dark:text-slate-400">${nt?esc(cname(nt)):t("nonat2")}</p></div><button onclick="closeM()" class="self-start px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700">✕</button></div>
<div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">${box(t("tplayed"),tn.length||"—")}${box(t("ncatch"),rows.length)}${box(t("pokes"),new Set(rows.filter(r=>r.c.medal==="gold").map(r=>r.p.id)).size+"/151")}${box(t("pts"),pts)}${box(t("summary"),"🥇"+mc("gold")+" 🥈"+mc("silver")+" 🥉"+mc("bronze"))}</div>
${tn.length?`<p class="text-xs text-slate-500 dark:text-slate-400">🏟️ ${tn.map(esc).join(" · ")}</p>`:""}
<div><h4 class="font-bold mb-2">${t("pregistry")}</h4><div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead><tr class="text-slate-400 border-b border-slate-200 dark:border-slate-600"><th class="py-1 px-2">Pokémon</th><th class="px-2">${t("game")}</th><th class="px-2">${t("medal")}</th><th class="px-2">${t("torneo")}</th><th class="px-2">${t("date")}</th>${can?"<th></th>":""}</tr></thead><tbody>`+rows.map(r=>{const ty=TY[r.p.type]||TY.Normal;return `<tr class="border-b border-slate-100 dark:border-slate-700"><td class="py-1.5 px-2"><button onclick="openM(${r.p.id})" class="flex items-center gap-2 font-semibold hover:underline">${r.p.img?`<img src="${esc(r.p.img)}" class="w-8 h-8 object-contain">`:`<span class="fl text-xl">${ty[0]}</span>`}${esc(r.p.name)}</button></td><td class="px-2">${esc(r.c.game)}</td><td class="px-2">${MED[r.c.medal][0]}${r.c.mult>1?" ×"+r.c.mult:""}</td><td class="px-2">${r.c.torneo?esc(r.c.torneo):"—"}</td><td class="px-2 whitespace-nowrap">${fd(r.c.date)}</td>${can?`<td class="px-2"><button onclick="delC(${r.p.id},${r.i})" class="text-red-600 hover:underline">${armed==="c"+r.p.id+"_"+r.i?t("conf"):t("del")}</button></td>`:""}</tr>`}).join("")+`</tbody></table></div></div>`;
modal.classList.remove("hidden");modal.classList.add("flex")}
function openM(id,keep){const p=items.find(x=>x.id===id);if(!p){closeM();return}sel=id;selP=null;const ty=TY[p.type]||TY.Normal;
const tables=GAMES.map(g=>{const s={};p.catches.filter(c=>c.game===g).forEach(c=>{s[c.player]=s[c.player]||{n:c.player,gold:0,silver:0,bronze:0,pts:0};s[c.player][c.medal]++;s[c.player].pts+=MED[c.medal][1]*(c.mult||1)});
const r=Object.values(s).sort((a,b)=>b.pts-a.pts||b.gold-a.gold||b.silver-a.silver);
return `<div class="bg-slate-50 dark:bg-slate-700/40 rounded-2xl p-4"><h5 class="font-bold text-sm mb-2">🎲 ${g}</h5>`+(r.length?`<div class="overflow-x-auto"><table class="w-full text-xs text-left"><thead><tr class="text-slate-400 border-b border-slate-200 dark:border-slate-600"><th class="py-1 px-2">${t("pos")}</th><th class="px-2">${t("player")}</th><th class="px-2 text-center">${t("nat")}</th><th class="px-2 text-center">🥇</th><th class="px-2 text-center">🥈</th><th class="px-2 text-center">🥉</th><th class="px-2 text-right">${t("pts")}</th></tr></thead><tbody>`+r.map((x,i)=>`<tr class="border-b border-slate-100 dark:border-slate-700"><td class="py-1.5 px-2 font-bold text-slate-500">${i+1}</td><td class="px-2 font-semibold">${plb(x.n)}</td><td class="px-2 text-center text-base fl" title="${esc(cname(natOf(x.n)))}">${flag(natOf(x.n))}</td><td class="px-2 text-center">${x.gold}</td><td class="px-2 text-center">${x.silver}</td><td class="px-2 text-center">${x.bronze}</td><td class="px-2 text-right font-extrabold text-red-600 dark:text-red-400">${x.pts}</td></tr>`).join("")+`</tbody></table></div>`:`<p class="text-xs text-slate-400 italic">${t("nomatch")} ${g}.</p>`)+`</div>`}).join("");
const ap=[],seen=new Set();cs(p).forEach(c=>{if(!c.torneo&&!c.date)return;const k=(c.torneo||"")+"|"+(c.date||"")+"|"+c.game;if(!seen.has(k)){seen.add(k);ap.push({n:c.torneo||"—",d:c.date||"",g:c.game})}});ap.sort((a,b)=>a.d.localeCompare(b.d));
const fdt=d=>d?new Date(d+"T00:00:00").toLocaleDateString(lang):"—";
const hist=ap.map((a,i)=>`<li class="flex items-center gap-3 py-1.5 text-sm border-b border-slate-100 dark:border-slate-700"><span class="w-7 h-7 rounded-full ${GC[a.g]||"bg-slate-500"} text-white text-xs font-bold flex items-center justify-center shrink-0">${i+1}</span><span class="flex-1 font-semibold">${esc(a.n)}</span><span class="text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${fdt(a.d)}</span></li>`).join("");
mbox.innerHTML=`<div class="flex items-center gap-4">${pic(p,"w-24 h-24 shrink-0")}
<div class="flex-1"><span class="text-xs font-bold text-red-600">#${String(p.id).padStart(3,"0")} · ${esc(p.type)}</span><h2 class="text-2xl font-extrabold">${esc(p.name)}</h2>${can?`<label class="text-xs text-red-600 hover:underline cursor-pointer">📷 ${t("img")}<input type="file" accept="image/*" class="hidden" onchange="upImg(${p.id},this.files[0])"></label>`:""}</div>
<button onclick="closeM()" class="self-start px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-700">✕</button></div>
<div><h4 class="font-bold mb-2">${t("summary")}</h4><div class="grid grid-cols-3 gap-3 text-center">${Object.keys(MED).map(m=>`<div class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-3"><p class="text-xs">${MED[m][0]} ${t(m)}</p><p class="text-2xl font-black">${cnt(p,m)}</p></div>`).join("")}</div></div>
<div class="space-y-3"><h4 class="font-bold">${t("leagues")}</h4>${tables}</div>
${hist?`<div><h4 class="font-bold mb-1">${t("apar")}${gs()}</h4>${gf==="all"?`<p class="flex flex-wrap gap-3 text-xs text-slate-500 dark:text-slate-400 mb-1">${GAMES.map(g=>`<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full ${GC[g]}"></span>${g}</span>`).join("")}</p>`:""}<ul>${hist}</ul></div>`:""}
${can?`<button onclick="delP(${p.id})" class="text-sm text-red-600 hover:underline">${armed==="p"+p.id?t("conf"):t("delp")}</button>`:""}`;
modal.classList.remove("hidden");modal.classList.add("flex")}
function closeM(){sel=null;selP=null;modal.classList.add("hidden");modal.classList.remove("flex")}
i18n();draw();

</script>
</body></html>
